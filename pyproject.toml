[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "income-apps"
version = "0.1.0"
description = "Small trading/income apps built on the Kraken CLI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
income-apps-dca = "income_apps.dca_bot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
