# Deploys Billsnap to Cloudflare Pages (free custom domains).
#
# GitHub Pages is not used: the account already serves fd17.github.io.
#
# One-time setup:
#   1. Cloudflare account (free).
#   2. Repo secrets: CLOUDFLARE_API_TOKEN (Account → Cloudflare Pages → Edit)
#      and CLOUDFLARE_ACCOUNT_ID.
#   3. Repo variable BILLSNAP_SITE_URL = https://sendtheinvoice.com (optional).
#   4. Repo variable PUBLIC_CHECKOUT_URL = Stripe Payment Link (buy.stripe.com/...).
#      After-pay redirect must be https://sendtheinvoice.com/app/?unlocked=1
#   5. DNS already points at fd17-billsnap.pages.dev on sendtheinvoice.com.
name: Deploy Billsnap to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/billsnap/**'
      - 'packages/ui/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  workflow_dispatch:

concurrency:
  group: billsnap-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter billsnap test
      - name: Build billsnap
        run: pnpm --filter billsnap build
        env:
          SITE_URL: ${{ vars.BILLSNAP_SITE_URL || 'https://sendtheinvoice.com' }}
          BASE_PATH: /
          # Public Payment Link URL (inlined into static HTML). Prefer a repo
          # variable; a secret also works if you already stored it there.
          PUBLIC_CHECKOUT_URL: ${{ vars.PUBLIC_CHECKOUT_URL || secrets.PUBLIC_CHECKOUT_URL }}
          PUBLIC_DONATE_URL: ${{ vars.PUBLIC_DONATE_URL || secrets.PUBLIC_DONATE_URL }}
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/billsnap/dist --project-name=fd17-billsnap --branch=main
      - name: Attach custom domain
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BILLSNAP_SITE_URL: ${{ vars.BILLSNAP_SITE_URL || 'https://sendtheinvoice.com' }}
        run: |
          host="${BILLSNAP_SITE_URL#https://}"
          host="${host#http://}"
          host="${host%%/*}"
          chmod +x ./scripts/attach-billsnap-domain.sh
          ./scripts/attach-billsnap-domain.sh "$host"
