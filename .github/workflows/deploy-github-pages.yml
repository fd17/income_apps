# Deploys Billsnap (apps/billsnap) to GitHub Pages — a zero-config, zero-secret
# free host. GitHub Pages serves a single site per repository, so this is the
# repo's primary income site. Use Cloudflare Pages when publishing many sites.
#
# Before the first run: repo Settings → Pages → "Build and deployment" → Source =
# "GitHub Actions". Then this workflow can publish on push.
name: Deploy to GitHub Pages

on:
  push:
    paths:
      - 'apps/billsnap/**'
      - 'packages/ui/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/configure-pages@v5
        id: pages
      - run: pnpm install --frozen-lockfile
      - name: Test billsnap
        run: pnpm --filter billsnap test
      - name: Build billsnap
        run: pnpm --filter billsnap build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/billsnap/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
