# Deploys ONE site (apps/example-site) to GitHub Pages — a zero-config, zero-secret
# free host. GitHub Pages serves a single site per repository, so use this for the
# repo's primary site and use Cloudflare Pages (deploy-cloudflare-pages.yml) when
# you want to publish many sites from this monorepo.
#
# Before the first run: repo Settings → Pages → "Build and deployment" → Source =
# "GitHub Actions". Then run this workflow.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/configure-pages@v5
        id: pages
      - run: pnpm install --frozen-lockfile
      - name: Build example-site
        run: pnpm --filter example-site build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/example-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
